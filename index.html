<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>English Mistake Log | オンライン英会話 復習ノート</title>
  <style>
    :root {
      color-scheme: light dark;

      --bg-light: #f8fafc;
      --bg-dark: #0f172a;
      --surface-light: #ffffff;
      --surface-dark: #1e293b;
      --surface-muted-light: #f1f5f9;
      --surface-muted-dark: #334155;
      --text-light: #0f172a;
      --text-dark: #f1f5f9;
      --text-muted-light: #475569;
      --text-muted-dark: #cbd5e1;
      --border-light: #e2e8f0;
      --border-dark: #334155;

      --primary-light: #2563eb;
      --primary-dark: #60a5fa;
      --primary-text-light: #ffffff;
      --primary-text-dark: #0f172a;
      --primary-soft-light: #eff6ff;
      --primary-soft-dark: rgba(96, 165, 250, 0.16);

      --danger-light: #dc2626;
      --danger-dark: #fca5a5;
      --danger-soft-light: #fef2f2;
      --danger-soft-dark: rgba(248, 113, 113, 0.14);
      --danger-border-light: #fecaca;
      --danger-border-dark: rgba(248, 113, 113, 0.4);

      --success-light: #059669;
      --success-dark: #6ee7b7;
      --success-soft-light: #ecfdf5;
      --success-soft-dark: rgba(52, 211, 153, 0.14);
      --success-border-light: #a7f3d0;
      --success-border-dark: rgba(52, 211, 153, 0.4);

      --bg: var(--bg-light);
      --surface: var(--surface-light);
      --surface-muted: var(--surface-muted-light);
      --text: var(--text-light);
      --text-muted: var(--text-muted-light);
      --border: var(--border-light);
      --primary: var(--primary-light);
      --primary-text: var(--primary-text-light);
      --primary-soft: var(--primary-soft-light);
      --danger: var(--danger-light);
      --danger-soft: var(--danger-soft-light);
      --danger-border: var(--danger-border-light);
      --success: var(--success-light);
      --success-soft: var(--success-soft-light);
      --success-border: var(--success-border-light);

      --shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.05);
      --radius: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: var(--bg-dark);
        --surface: var(--surface-dark);
        --surface-muted: var(--surface-muted-dark);
        --text: var(--text-dark);
        --text-muted: var(--text-muted-dark);
        --border: var(--border-dark);
        --primary: var(--primary-dark);
        --primary-text: var(--primary-text-dark);
        --primary-soft: var(--primary-soft-dark);
        --danger: var(--danger-dark);
        --danger-soft: var(--danger-soft-dark);
        --danger-border: var(--danger-border-dark);
        --success: var(--success-dark);
        --success-soft: var(--success-soft-dark);
        --success-border: var(--success-border-dark);
      }
    }

    @supports (color: light-dark(white, black)) {
      :root {
        --bg: light-dark(var(--bg-light), var(--bg-dark));
        --surface: light-dark(var(--surface-light), var(--surface-dark));
        --surface-muted: light-dark(var(--surface-muted-light), var(--surface-muted-dark));
        --text: light-dark(var(--text-light), var(--text-dark));
        --text-muted: light-dark(var(--text-muted-light), var(--text-muted-dark));
        --border: light-dark(var(--border-light), var(--border-dark));
        --primary: light-dark(var(--primary-light), var(--primary-dark));
        --primary-text: light-dark(var(--primary-text-light), var(--primary-text-dark));
        --primary-soft: light-dark(var(--primary-soft-light), var(--primary-soft-dark));
        --danger: light-dark(var(--danger-light), var(--danger-dark));
        --danger-soft: light-dark(var(--danger-soft-light), var(--danger-soft-dark));
        --danger-border: light-dark(var(--danger-border-light), var(--danger-border-dark));
        --success: light-dark(var(--success-light), var(--success-dark));
        --success-soft: light-dark(var(--success-soft-light), var(--success-soft-dark));
        --success-border: light-dark(var(--success-border-light), var(--success-border-dark));
      }
    }

    body, header, main, section, search, article, div, input, button, ul {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    .container {
      max-width: 960px;
      margin-inline: auto;
      padding-block: 28px 64px;
      padding-inline: 18px;
    }

    header {
      margin-block-end: 24px;
    }

    h1 {
      margin: 0;
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin-block: 6px 0;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-block-end: 20px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding-block: 14px;
      padding-inline: 16px;
      box-shadow: var(--shadow);
    }

    .stat-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      margin-block-start: 2px;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      margin-block-end: 16px;
    }

    .controls-top {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .search-input {
      flex: 1 1 240px;
      padding-block: 10px;
      padding-inline: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      background: var(--bg);
      color: var(--text);
    }

    .search-input:focus-visible,
    .btn:focus-visible,
    .pill:focus-visible,
    .mastered-btn:focus-visible,
    .reveal-btn:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .btn,
    .pill,
    .mastered-btn,
    .reveal-btn {
      appearance: none;
      font: inherit;
      cursor: pointer;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding-block: 9px;
      padding-inline: 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
    }

    .btn:hover:not(:disabled) {
      background: var(--surface-muted);
    }

    .btn[aria-pressed="true"] {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-text);
    }

    .category-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      border: 1px solid var(--border);
      background: var(--surface-muted);
      color: var(--text-muted);
      padding-block: 5px;
      padding-inline: 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      transition: border-color 0.15s, color 0.15s, background-color 0.15s;
    }

    .pill:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
    }

    .pill[aria-pressed="true"] {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .results-status {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-block-end: 12px;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding-block: 18px;
      padding-inline: 20px;
      box-shadow: var(--shadow);
      transition: opacity 0.2s;
    }

    .card.is-mastered {
      opacity: 0.76;
    }

    .card-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-block-end: 14px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .date {
      font-size: 0.84rem;
      color: var(--text-muted);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .badge {
      font-size: 0.76rem;
      font-weight: 700;
      padding-block: 3px;
      padding-inline: 10px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .tag {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: var(--surface-muted);
      padding-block: 2px;
      padding-inline: 8px;
      border-radius: 6px;
    }

    .mastered-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      padding-block: 5px;
      padding-inline: 11px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .mastered-btn[aria-pressed="true"] {
      background: var(--success-soft);
      border-color: var(--success-border);
      color: var(--success);
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .bookmark-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      padding-block: 5px;
      padding-inline: 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .bookmark-btn[aria-pressed="true"] {
      background: rgba(245, 158, 11, 0.14);
      border-color: rgba(245, 158, 11, 0.5);
      color: #d97706;
    }

    @media (prefers-color-scheme: dark) {
      .bookmark-btn[aria-pressed="true"] {
        color: #fbbf24;
      }
    }

    .expr-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-block-end: 14px;
    }

    .expr-box {
      padding-block: 12px;
      padding-inline: 14px;
      border-radius: 8px;
      border: 1px solid;
    }

    .expr-wrong {
      background: var(--danger-soft);
      border-color: var(--danger-border);
    }

    .expr-correct {
      background: var(--success-soft);
      border-color: var(--success-border);
    }

    .expr-japanese {
      background: var(--surface-muted);
      border-color: var(--border);
      margin-block-end: 10px;
    }

    .expr-japanese .expr-label {
      color: var(--primary);
    }

    .expr-japanese .expr-text {
      font-size: 1rem;
    }

    .expr-label {
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-block-end: 4px;
      display: block;
    }

    .expr-wrong .expr-label {
      color: var(--danger);
    }

    .expr-correct .expr-label {
      color: var(--success);
    }

    .expr-text {
      font-size: 1.05rem;
      font-weight: 600;
      margin: 0;
    }

    .expr-correct.hidden-answer .expr-text {
      filter: blur(7px);
      user-select: none;
    }

    .reveal-btn {
      display: none;
      margin-block-start: 8px;
      padding-block: 4px;
      padding-inline: 10px;
      border-radius: 6px;
      border: 1px solid var(--success-border);
      background: var(--surface);
      color: var(--success);
      font-size: 0.78rem;
      font-weight: 600;
    }

    .expr-correct.is-quiz .reveal-btn {
      display: inline-block;
    }

    .explanation {
      background: var(--surface-muted);
      border-radius: 8px;
      padding-block: 12px;
      padding-inline: 14px;
      font-size: 0.93rem;
      margin-block-end: 12px;
    }

    .explanation-title,
    .examples-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-block: 0 4px;
    }

    .examples {
      margin: 0;
      padding-inline-start: 18px;
      font-size: 0.92rem;
      color: var(--text);
    }

    .expr-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-block-end: 4px;
    }

    .expr-header .expr-label {
      margin-block-end: 0;
    }

    .speak-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      padding-block: 2px;
      padding-inline: 8px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 600;
      line-height: 1.4;
      flex-shrink: 0;
      transition: border-color 0.15s, color 0.15s, background-color 0.15s;
    }

    .speak-btn:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
    }

    .speak-btn.is-speaking {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .example-item {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .example-text {
      flex: 1;
      min-width: 0;
    }

    .examples li + li {
      margin-block-start: 6px;
    }

    .empty-state {
      text-align: center;
      padding-block: 48px;
      padding-inline: 20px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
    }

    .flashcard-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-block-end: 12px;
    }

    .flashcard-progress {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    body.is-flashcard-mode .container {
      padding-block: 10px 20px;
    }

    body.is-flashcard-mode header,
    body.is-flashcard-mode .stats,
    body.is-flashcard-mode .results-status {
      display: none;
    }

    body.is-flashcard-mode:not(.flashcard-filters-open) .controls {
      display: none;
    }

    body.is-flashcard-mode .controls {
      padding-block: 10px;
      padding-inline: 12px;
      margin-block-end: 10px;
    }

    .flashcard-toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .flashcard-toolbar .btn {
      padding-block: 5px;
      padding-inline: 10px;
      font-size: 0.78rem;
    }

    @media (max-width: 600px) {
      body.is-flashcard-mode .card {
        padding-block: 12px;
        padding-inline: 14px;
      }

      body.is-flashcard-mode .card-header {
        margin-block-end: 8px;
      }

      body.is-flashcard-mode .flashcard-prompt {
        padding-block: 10px;
        padding-inline: 12px;
        margin-block-end: 10px;
      }

      body.is-flashcard-mode .flashcard-prompt-text {
        font-size: 1.02rem;
      }

      body.is-flashcard-mode .flashcard-nav .btn,
      body.is-flashcard-mode .flashcard-nav .mastered-btn {
        padding-block: 6px;
        padding-inline: 10px;
        font-size: 0.8rem;
      }

      body.is-flashcard-mode .flashcard-answer {
        gap: 8px;
        margin-block-start: 10px;
        padding-block-start: 10px;
      }

      body.is-flashcard-mode .flashcard-hint {
        display: none;
      }
    }

    .flashcard-prompt {
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding-block: 14px;
      padding-inline: 16px;
      margin-block-end: 12px;
    }

    .flashcard-prompt-label {
      display: block;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--primary);
      margin-block-end: 4px;
    }

    .flashcard-prompt-text {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 700;
      line-height: 1.5;
      color: var(--text);
    }

    .flashcard-nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .flashcard-answer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-block-start: 14px;
      padding-block-start: 14px;
      border-top: 1px solid var(--border);
    }

    .flashcard-answer[hidden] {
      display: none;
    }

    .flashcard-answer .explanation {
      margin-block-end: 0;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-text);
    }

    .btn-primary:hover:not(:disabled) {
      background: #1d4ed8;
      border-color: #1d4ed8;
      color: var(--primary-text);
    }

    .flashcard-hint {
      margin-block: 10px 0;
      font-size: 0.74rem;
      color: var(--text-muted);
      text-align: center;
    }

    @media (min-width: 720px) {
      .expr-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>English Mistake Log</h1>
      <p class="subtitle">オンライン英会話で間違えた表現・より自然な言い回しの復習ノート</p>
    </header>

    <main>
      <section class="stats" aria-label="学習統計">
        <div class="stat-card">
          <div class="stat-label">登録フレーズ数</div>
          <div class="stat-value" id="stat-total">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">復習中</div>
          <div class="stat-value" id="stat-review">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">習得済み</div>
          <div class="stat-value" id="stat-mastered">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">ブックマーク</div>
          <div class="stat-value" id="stat-bookmarked">0</div>
        </div>
      </section>

      <search class="controls" aria-label="表現の検索と絞り込み">
        <div class="controls-top">
          <label for="search-input" class="visually-hidden">表現・解説・タグで検索</label>
          <input
            type="search"
            id="search-input"
            class="search-input"
            placeholder="表現・解説・タグで検索..."
          />
          <button type="button" id="toggle-quiz" class="btn" aria-pressed="true">答えを隠す (テスト)</button>
          <button type="button" id="toggle-unmastered" class="btn" aria-pressed="false">表示: すべて</button>
          <button type="button" id="toggle-bookmarked" class="btn" aria-pressed="false">★ ブックマークのみ</button>
          <button type="button" id="toggle-sort" class="btn" aria-label="並び順: 新しい順">新しい順 ↓</button>
          <button type="button" id="toggle-flashcard" class="btn" aria-pressed="false">瞬間英作文モード</button>
          <button type="button" id="reload-latest" class="btn" title="最新のデータを再読み込み">🔄 最新に更新</button>
          <button type="button" id="send-anki" class="btn" title="AnkiConnect経由でAnkiに送信">📥 Anki に送信</button>
        </div>
        <div class="category-pills" id="category-pills" role="group" aria-label="カテゴリ絞り込み"></div>
      </search>

      <div id="results-status" class="results-status" aria-live="polite"></div>

      <section class="cards" id="cards-container" aria-label="表現一覧"></section>
    </main>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = "english_mistake_log_mastered_v1";
      const BOOKMARK_KEY = "english_mistake_log_bookmarked_v1";
      let entries = [];

      let savedMastered = {};
      try {
        savedMastered = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      } catch (_) {
        savedMastered = {};
      }

      let savedBookmarks = {};
      try {
        savedBookmarks = JSON.parse(localStorage.getItem(BOOKMARK_KEY) || "{}");
      } catch (_) {
        savedBookmarks = {};
      }

      const state = {
        query: "",
        category: "All",
        quizMode: true,
        masteryFilter: "all",
        onlyBookmarked: false,
        sortOrder: "desc",
        flashcardMode: false,
        flashcardIndex: 0,
        flashcardRevealed: false,
        flashcardOrder: null,
        flashcardFiltersOpen: false
      };

      const els = {
        statTotal: document.getElementById("stat-total"),
        statReview: document.getElementById("stat-review"),
        statMastered: document.getElementById("stat-mastered"),
        statBookmarked: document.getElementById("stat-bookmarked"),
        searchInput: document.getElementById("search-input"),
        toggleQuiz: document.getElementById("toggle-quiz"),
        toggleUnmastered: document.getElementById("toggle-unmastered"),
        toggleBookmarked: document.getElementById("toggle-bookmarked"),
        toggleSort: document.getElementById("toggle-sort"),
        toggleFlashcard: document.getElementById("toggle-flashcard"),
        reloadLatest: document.getElementById("reload-latest"),
        sendAnki: document.getElementById("send-anki"),
        categoryPills: document.getElementById("category-pills"),
        resultsStatus: document.getElementById("results-status"),
        cardsContainer: document.getElementById("cards-container")
      };

      function isMastered(entry) {
        if (Object.prototype.hasOwnProperty.call(savedMastered, entry.id)) {
          return Boolean(savedMastered[entry.id]);
        }
        return Boolean(entry.mastered);
      }

      function isBookmarked(entry) {
        return Boolean(savedBookmarks[entry.id]);
      }

      function toggleMastered(id) {
        const target = entries.find((e) => e.id === id);
        if (!target) return;
        const next = !isMastered(target);
        savedMastered[id] = next;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(savedMastered));
        } catch (_) {
          // ignore storage errors
        }
        if (
          state.flashcardMode &&
          ((state.masteryFilter === "unmastered" && next) || (state.masteryFilter === "mastered" && !next))
        ) {
          state.flashcardRevealed = false;
        }
        render();
      }

      function toggleBookmark(id) {
        const target = entries.find((e) => e.id === id);
        if (!target) return;
        const next = !isBookmarked(target);
        if (next) {
          savedBookmarks[id] = true;
        } else {
          delete savedBookmarks[id];
        }
        try {
          localStorage.setItem(BOOKMARK_KEY, JSON.stringify(savedBookmarks));
        } catch (_) {
          // ignore storage errors
        }
        if (state.flashcardMode && state.onlyBookmarked && !next) {
          state.flashcardRevealed = false;
        }
        render();
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function renderCategories() {
        const categories = ["All", ...new Set(entries.map((e) => e.category).filter(Boolean))];
        els.categoryPills.innerHTML = categories
          .map((cat) => {
            const pressed = state.category === cat ? "true" : "false";
            const label = cat === "All" ? "すべて" : escapeHtml(cat);
            return `<button type="button" class="pill" aria-pressed="${pressed}" data-category="${escapeHtml(cat)}">${label}</button>`;
          })
          .join("");
      }

      function renderStats() {
        const total = entries.length;
        const mastered = entries.filter(isMastered).length;
        const bookmarked = entries.filter(isBookmarked).length;
        els.statTotal.textContent = total;
        els.statMastered.textContent = mastered;
        els.statReview.textContent = total - mastered;
        els.statBookmarked.textContent = bookmarked;
      }

      function getMasteryLabel() {
        if (state.masteryFilter === "unmastered") return "未習得のみ";
        if (state.masteryFilter === "mastered") return "習得済みのみ";
        return "表示: すべて";
      }

      function cycleMasteryFilter() {
        if (state.masteryFilter === "all") {
          state.masteryFilter = "unmastered";
        } else if (state.masteryFilter === "unmastered") {
          state.masteryFilter = "mastered";
        } else {
          state.masteryFilter = "all";
        }
        state.flashcardIndex = 0;
        state.flashcardRevealed = false;
        els.toggleUnmastered.textContent = getMasteryLabel();
        els.toggleUnmastered.setAttribute("aria-pressed", String(state.masteryFilter !== "all"));
        renderCards();
      }

      function toggleBookmarkFilter() {
        state.onlyBookmarked = !state.onlyBookmarked;
        state.flashcardIndex = 0;
        state.flashcardRevealed = false;
        els.toggleBookmarked.setAttribute("aria-pressed", String(state.onlyBookmarked));
        renderCards();
      }

      function matchesFilter(entry) {
        if (state.category !== "All" && entry.category !== state.category) {
          return false;
        }
        if (state.masteryFilter === "unmastered" && isMastered(entry)) {
          return false;
        }
        if (state.masteryFilter === "mastered" && !isMastered(entry)) {
          return false;
        }
        if (state.onlyBookmarked && !isBookmarked(entry)) {
          return false;
        }
        if (state.query.trim()) {
          const q = state.query.trim().toLowerCase();
          const haystack = [
            entry.japanese,
            entry.whatISaid,
            entry.correction,
            entry.explanation,
            entry.category,
            entry.date,
            ...(entry.examples || []),
            ...(entry.tags || [])
          ]
            .join(" ")
            .toLowerCase();
          if (!haystack.includes(q)) return false;
        }
        return true;
      }

      const canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
      let activeSpeakBtn = null;
      let preferredVoice = null;
      let currentUtterance = null;
      let speakTimer = null;

      const NATURAL_VOICE_NAMES = [
        "Microsoft Aria",
        "Microsoft Jenny",
        "Microsoft Guy",
        "Samantha",
        "Ava",
        "Allison",
        "Alex",
        "Aaron",
        "Nicky",
        "Daniel",
        "Karen",
        "Moira",
        "Tessa",
        "Google US English",
        "Google UK English Female",
        "Google UK English Male",
        "Microsoft Zira",
        "Microsoft David",
        "Microsoft Mark"
      ];

      const EXCLUDED_VOICE_PATTERN =
        /Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Eddy|Flo|Fred|Good News|Grandma|Grandpa|Jester|Junior|Kathy|Organ|Ralph|Reed|Rocko|Sandy|Shelley|Superstar|Trinoids|Whisper|Wobble|Zarvox/i;

      function getEnglishVoices() {
        if (!canSpeak) return [];
        const voices = window.speechSynthesis.getVoices() || [];
        return voices.filter(
          (v) => v.lang && v.lang.toLowerCase().startsWith("en") && !EXCLUDED_VOICE_PATTERN.test(v.name || "")
        );
      }

      function pickEnglishVoice() {
        const allEn = getEnglishVoices();
        if (allEn.length === 0) return null;

        // リモート音声(Online/Google等)は環境によって無音ハングするため、ローカル音声を最優先する
        const localEn = allEn.filter((v) => v.localService);
        const enVoices = localEn.length > 0 ? localEn : allEn;

        // 1. ローカルの高品質音声（Enhanced / Premium / Natural）を優先
        const highQuality = enVoices.filter((v) => /Natural|Enhanced|Premium/i.test(v.name || ""));
        for (const name of NATURAL_VOICE_NAMES) {
          const matched = highQuality.find((v) => v.name && v.name.includes(name));
          if (matched) return matched;
        }
        if (highQuality.length > 0) {
          return highQuality.find((v) => v.lang === "en-US") || highQuality[0];
        }

        // 2. 各OSの標準的な明瞭音声を優先
        for (const name of NATURAL_VOICE_NAMES) {
          const matched = enVoices.find((v) => v.name && v.name.includes(name));
          if (matched) return matched;
        }

        // 3. en-US デフォルト → その他の英語音声
        return (
          enVoices.find((v) => v.lang === "en-US" && v.default) ||
          enVoices.find((v) => v.lang === "en-US") ||
          enVoices[0] ||
          null
        );
      }

      if (canSpeak) {
        preferredVoice = pickEnglishVoice();
        if (typeof window.speechSynthesis.addEventListener === "function") {
          window.speechSynthesis.addEventListener("voiceschanged", () => {
            preferredVoice = pickEnglishVoice();
          });
        }
      }

      function resetSpeakState() {
        currentUtterance = null;
        if (activeSpeakBtn) {
          activeSpeakBtn.classList.remove("is-speaking");
          activeSpeakBtn.textContent = "🔊 再生";
          activeSpeakBtn.setAttribute("aria-pressed", "false");
          activeSpeakBtn = null;
        }
      }

      function stopSpeaking() {
        if (speakTimer) {
          clearTimeout(speakTimer);
          speakTimer = null;
        }
        if (canSpeak && (window.speechSynthesis.speaking || window.speechSynthesis.pending)) {
          window.speechSynthesis.cancel();
        }
        resetSpeakState();
      }

      function speakText(text, btn) {
        if (!canSpeak || !text) return;
        const wasSameActive = activeSpeakBtn === btn && (window.speechSynthesis.speaking || window.speechSynthesis.pending);
        const needsCancel = window.speechSynthesis.speaking || window.speechSynthesis.pending;
        stopSpeaking();
        if (wasSameActive) return;

        const startSpeak = (useVoice = true) => {
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = "en-US";
          utterance.rate = 0.95;

          if (useVoice) {
            if (!preferredVoice) {
              preferredVoice = pickEnglishVoice();
            }
            if (preferredVoice) {
              utterance.voice = preferredVoice;
              if (preferredVoice.lang) {
                utterance.lang = preferredVoice.lang;
              }
            }
          }

          utterance.onend = resetSpeakState;
          utterance.onerror = () => {
            if (useVoice && utterance.voice) {
              startSpeak(false);
              return;
            }
            resetSpeakState();
          };
          currentUtterance = utterance;

          activeSpeakBtn = btn;
          btn.classList.add("is-speaking");
          btn.textContent = "■ 停止";
          btn.setAttribute("aria-pressed", "true");
          if (window.speechSynthesis.paused) {
            window.speechSynthesis.resume();
          }
          window.speechSynthesis.speak(utterance);
        };

        if (needsCancel) {
          speakTimer = setTimeout(() => {
            speakTimer = null;
            startSpeak(true);
          }, 60);
        } else {
          startSpeak(true);
        }
      }

      function speakBtnHtml(text, label) {
        if (!canSpeak || !text) return "";
        return `<button type="button" class="speak-btn" aria-label="${escapeHtml(label)}" aria-pressed="false" data-speak-text="${escapeHtml(text)}">🔊 再生</button>`;
      }

      function getFilteredEntries() {
        const dir = state.sortOrder === "asc" ? 1 : -1;
        const filtered = entries.filter(matchesFilter).sort((a, b) => {
          const dateA = String(a.date || "");
          const dateB = String(b.date || "");
          if (dateA !== dateB) {
            return dateA.localeCompare(dateB) * dir;
          }
          return String(a.id || "").localeCompare(String(b.id || "")) * dir;
        });

        if (state.flashcardMode && Array.isArray(state.flashcardOrder)) {
          const orderMap = new Map(state.flashcardOrder.map((id, idx) => [id, idx]));
          filtered.sort((a, b) => {
            const idxA = orderMap.has(a.id) ? orderMap.get(a.id) : Number.MAX_SAFE_INTEGER;
            const idxB = orderMap.has(b.id) ? orderMap.get(b.id) : Number.MAX_SAFE_INTEGER;
            return idxA - idxB;
          });
        }
        return filtered;
      }

      function renderFlashcard(filtered) {
        if (state.flashcardIndex >= filtered.length) {
          state.flashcardIndex = Math.max(0, filtered.length - 1);
        }
        if (state.flashcardIndex < 0) {
          state.flashcardIndex = 0;
        }
        const entry = filtered[state.flashcardIndex];
        const mastered = isMastered(entry);
        const bookmarked = isBookmarked(entry);
        const tagsHtml = (entry.tags || [])
          .map((t) => `<span class="tag">#${escapeHtml(t)}</span>`)
          .join("");
        const examplesHtml = (entry.examples && entry.examples.length)
          ? `<div>
              <h2 class="examples-title">例文 (Example)</h2>
              <ul class="examples" lang="en">
                ${entry.examples
                  .map(
                    (ex) =>
                      `<li><div class="example-item"><span class="example-text">${escapeHtml(ex)}</span>${speakBtnHtml(ex, "例文を再生")}</div></li>`
                  )
                  .join("")}
              </ul>
            </div>`
          : "";
        const promptText = entry.japanese || entry.explanation || entry.whatISaid || "";

        els.cardsContainer.innerHTML = `
          <div class="flashcard-wrap">
            <div class="flashcard-toolbar">
              <span class="flashcard-progress">${state.flashcardIndex + 1} / ${filtered.length}</span>
              <div class="flashcard-toolbar-actions">
                <button type="button" class="btn" data-flashcard-mastery aria-pressed="${state.masteryFilter !== "all" ? "true" : "false"}">${escapeHtml(getMasteryLabel())}</button>
                <button type="button" class="btn" data-flashcard-bookmarked aria-pressed="${String(state.onlyBookmarked)}">★ ブックマーク</button>
                <button type="button" class="btn" data-flashcard-filters aria-pressed="${String(state.flashcardFiltersOpen)}">絞り込み</button>
                <button type="button" class="btn" data-flashcard-shuffle>🔀 シャッフル</button>
                <button type="button" class="btn" data-flashcard-exit>一覧へ</button>
              </div>
            </div>
            <article class="card${mastered ? " is-mastered" : ""}">
              <div class="card-header">
                <div class="meta">
                  <time class="date" datetime="${escapeHtml(entry.date || "")}">${escapeHtml(entry.date || "")}</time>
                  <span class="badge">${escapeHtml(entry.category || "General")}</span>
                  ${tagsHtml}
                </div>
                <div class="card-actions">
                  <button type="button" class="bookmark-btn" aria-pressed="${bookmarked ? "true" : "false"}" data-bookmark-id="${escapeHtml(entry.id)}" aria-label="ブックマークを切り替え">
                    ${bookmarked ? "★" : "☆"}
                  </button>
                  <button type="button" class="mastered-btn" aria-pressed="${mastered ? "true" : "false"}" data-mastered-id="${escapeHtml(entry.id)}">
                    ${mastered ? "✓ 習得済み" : "未習得"}
                  </button>
                </div>
              </div>

              <div class="flashcard-prompt">
                <span class="flashcard-prompt-label">日本語訳（英語で言ってみよう）</span>
                <p class="flashcard-prompt-text">${escapeHtml(promptText)}</p>
              </div>

              <div class="flashcard-nav">
                <button type="button" class="btn" data-flashcard-prev ${state.flashcardIndex === 0 ? "disabled" : ""}>← 前へ</button>
                <div style="display:flex; flex-wrap:wrap; gap:8px; justify-content:center;">
                  <button type="button" class="btn btn-primary" data-flashcard-toggle aria-expanded="${String(state.flashcardRevealed)}">
                    ${state.flashcardRevealed ? "答えを隠す" : "答えを見る"}
                  </button>
                  <button type="button" class="mastered-btn" aria-pressed="${mastered ? "true" : "false"}" data-mastered-id="${escapeHtml(entry.id)}">
                    ${mastered ? "✓ 習得済み (戻す)" : "✓ 習得済みにする"}
                  </button>
                </div>
                <button type="button" class="btn" data-flashcard-next ${state.flashcardIndex >= filtered.length - 1 ? "disabled" : ""}>次へ →</button>
              </div>

              <div class="flashcard-answer" ${state.flashcardRevealed ? "" : "hidden"}>
                <div class="expr-box expr-correct">
                  <div class="expr-header">
                    <span class="expr-label">自然な英語表現</span>
                    ${speakBtnHtml(entry.correction || "", "自然な表現を再生")}
                  </div>
                  <p class="expr-text" lang="en">${escapeHtml(entry.correction || "")}</p>
                </div>

                <div class="explanation">
                  <h2 class="explanation-title">解説</h2>
                  <div>${escapeHtml(entry.explanation || "")}</div>
                </div>

                ${examplesHtml}
              </div>

              <p class="flashcard-hint">ショートカット: Space で答えを表示/非表示 · ← / → で前後のカードへ</p>
            </article>
          </div>
        `;
      }

      function renderCards() {
        stopSpeaking();
        const filtered = getFilteredEntries();
        els.resultsStatus.textContent = state.flashcardMode
          ? `瞬間英作文モード: ${filtered.length}件中 ${filtered.length ? state.flashcardIndex + 1 : 0}件目`
          : `${filtered.length}件の表現を表示中`;

        if (filtered.length === 0) {
          els.cardsContainer.innerHTML = state.flashcardMode
            ? `<div class="empty-state">
                <p style="margin:0 0 12px;">条件に一致する表現がありません（現在: ${escapeHtml(getMasteryLabel())}${state.onlyBookmarked ? " / ★ ブックマークのみ" : ""}）。</p>
                <div style="display:flex; flex-wrap:wrap; gap:8px; justify-content:center;">
                  <button type="button" class="btn" data-flashcard-mastery aria-pressed="${state.masteryFilter !== "all" ? "true" : "false"}">${escapeHtml(getMasteryLabel())} を切替</button>
                  <button type="button" class="btn" data-flashcard-bookmarked aria-pressed="${String(state.onlyBookmarked)}">★ ブックマーク</button>
                  <button type="button" class="btn" data-flashcard-filters aria-pressed="${String(state.flashcardFiltersOpen)}">絞り込み</button>
                  <button type="button" class="btn" data-flashcard-exit>一覧へ</button>
                </div>
              </div>`
            : `<div class="empty-state">条件に一致する表現がありません。</div>`;
          return;
        }

        if (state.flashcardMode) {
          renderFlashcard(filtered);
          return;
        }

        els.cardsContainer.innerHTML = filtered
          .map((entry) => {
            const mastered = isMastered(entry);
            const bookmarked = isBookmarked(entry);
            const tagsHtml = (entry.tags || [])
              .map((t) => `<span class="tag">#${escapeHtml(t)}</span>`)
              .join("");
            const japaneseHtml = entry.japanese
              ? `<div class="expr-box expr-japanese">
                  <span class="expr-label">日本語訳</span>
                  <p class="expr-text">${escapeHtml(entry.japanese)}</p>
                </div>`
              : "";
            const examplesHtml = (entry.examples && entry.examples.length)
              ? `<div>
                  <h2 class="examples-title">例文 (Example)</h2>
                  <ul class="examples" lang="en">
                    ${entry.examples
                      .map(
                        (ex) =>
                          `<li><div class="example-item"><span class="example-text">${escapeHtml(ex)}</span>${speakBtnHtml(ex, "例文を再生")}</div></li>`
                      )
                      .join("")}
                  </ul>
                </div>`
              : "";

            return `
              <article class="card${mastered ? " is-mastered" : ""}">
                <div class="card-header">
                  <div class="meta">
                    <time class="date" datetime="${escapeHtml(entry.date || "")}">${escapeHtml(entry.date || "")}</time>
                    <span class="badge">${escapeHtml(entry.category || "General")}</span>
                    ${tagsHtml}
                  </div>
                  <div class="card-actions">
                    <button type="button" class="bookmark-btn" aria-pressed="${bookmarked ? "true" : "false"}" data-bookmark-id="${escapeHtml(entry.id)}" aria-label="ブックマークを切り替え">
                      ${bookmarked ? "★" : "☆"}
                    </button>
                    <button type="button" class="mastered-btn" aria-pressed="${mastered ? "true" : "false"}" data-mastered-id="${escapeHtml(entry.id)}">
                      ${mastered ? "✓ 習得済み" : "未習得"}
                    </button>
                  </div>
                </div>

                ${japaneseHtml}

                <div class="expr-grid">
                  <div class="expr-box expr-wrong">
                    <span class="expr-label">自分の表現 (What I said)</span>
                    <p class="expr-text" lang="en">${escapeHtml(entry.whatISaid || "")}</p>
                  </div>
                  <div class="expr-box expr-correct${state.quizMode ? " is-quiz hidden-answer" : ""}" data-answer-box>
                    <div class="expr-header">
                      <span class="expr-label">自然な表現 (Better / Correct)</span>
                      ${speakBtnHtml(entry.correction || "", "自然な表現を再生")}
                    </div>
                    <p class="expr-text" lang="en">${escapeHtml(entry.correction || "")}</p>
                    <button type="button" class="reveal-btn" data-reveal-btn aria-expanded="false">答えを表示</button>
                  </div>
                </div>

                <div class="explanation">
                  <h2 class="explanation-title">解説</h2>
                  <div>${escapeHtml(entry.explanation || "")}</div>
                </div>

                ${examplesHtml}
              </article>
            `;
          })
          .join("");
      }

      function render() {
        renderStats();
        renderCategories();
        renderCards();
      }

      els.searchInput.addEventListener("input", (e) => {
        state.query = e.target.value;
        state.flashcardIndex = 0;
        state.flashcardRevealed = false;
        renderCards();
      });

      els.toggleQuiz.addEventListener("click", () => {
        state.quizMode = !state.quizMode;
        els.toggleQuiz.setAttribute("aria-pressed", String(state.quizMode));
        renderCards();
      });

      els.toggleUnmastered.addEventListener("click", cycleMasteryFilter);

      els.toggleBookmarked.addEventListener("click", toggleBookmarkFilter);

      els.toggleSort.addEventListener("click", () => {
        state.sortOrder = state.sortOrder === "desc" ? "asc" : "desc";
        state.flashcardOrder = null;
        state.flashcardIndex = 0;
        state.flashcardRevealed = false;
        const isAsc = state.sortOrder === "asc";
        els.toggleSort.textContent = isAsc ? "古い順 ↑" : "新しい順 ↓";
        els.toggleSort.setAttribute("aria-label", `並び順: ${isAsc ? "古い順" : "新しい順"}`);
        renderCards();
      });

      els.toggleFlashcard.addEventListener("click", () => {
        state.flashcardMode = !state.flashcardMode;
        state.flashcardIndex = 0;
        state.flashcardRevealed = false;
        state.flashcardOrder = null;
        state.flashcardFiltersOpen = false;
        document.body.classList.toggle("is-flashcard-mode", state.flashcardMode);
        document.body.classList.remove("flashcard-filters-open");
        els.toggleFlashcard.setAttribute("aria-pressed", String(state.flashcardMode));
        els.toggleQuiz.disabled = state.flashcardMode;
        renderCards();
      });

      els.categoryPills.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-category]");
        if (!btn) return;
        state.category = btn.getAttribute("data-category");
        state.flashcardIndex = 0;
        state.flashcardRevealed = false;
        render();
      });

      els.cardsContainer.addEventListener("click", (e) => {
        const speakBtn = e.target.closest("[data-speak-text]");
        if (speakBtn) {
          speakText(speakBtn.getAttribute("data-speak-text"), speakBtn);
          return;
        }
        const bookmarkBtn = e.target.closest("[data-bookmark-id]");
        if (bookmarkBtn) {
          toggleBookmark(bookmarkBtn.getAttribute("data-bookmark-id"));
          return;
        }
        const masteredBtn = e.target.closest("[data-mastered-id]");
        if (masteredBtn) {
          toggleMastered(masteredBtn.getAttribute("data-mastered-id"));
          return;
        }
        const fcBookmarked = e.target.closest("[data-flashcard-bookmarked]");
        if (fcBookmarked) {
          toggleBookmarkFilter();
          return;
        }
        const fcToggle = e.target.closest("[data-flashcard-toggle]");
        if (fcToggle) {
          state.flashcardRevealed = !state.flashcardRevealed;
          renderCards();
          return;
        }
        const fcPrev = e.target.closest("[data-flashcard-prev]");
        if (fcPrev) {
          if (state.flashcardIndex > 0) {
            state.flashcardIndex -= 1;
            state.flashcardRevealed = false;
            renderCards();
          }
          return;
        }
        const fcNext = e.target.closest("[data-flashcard-next]");
        if (fcNext) {
          const total = getFilteredEntries().length;
          if (state.flashcardIndex < total - 1) {
            state.flashcardIndex += 1;
            state.flashcardRevealed = false;
            renderCards();
          }
          return;
        }
        const fcShuffle = e.target.closest("[data-flashcard-shuffle]");
        if (fcShuffle) {
          const ids = getFilteredEntries().map((item) => item.id);
          for (let i = ids.length - 1; i > 0; i -= 1) {
            const j = Math.floor(Math.random() * (i + 1));
            [ids[i], ids[j]] = [ids[j], ids[i]];
          }
          state.flashcardOrder = ids;
          state.flashcardIndex = 0;
          state.flashcardRevealed = false;
          renderCards();
          return;
        }
        const fcMastery = e.target.closest("[data-flashcard-mastery]");
        if (fcMastery) {
          cycleMasteryFilter();
          return;
        }
        const fcFilters = e.target.closest("[data-flashcard-filters]");
        if (fcFilters) {
          state.flashcardFiltersOpen = !state.flashcardFiltersOpen;
          document.body.classList.toggle("flashcard-filters-open", state.flashcardFiltersOpen);
          fcFilters.setAttribute("aria-pressed", String(state.flashcardFiltersOpen));
          return;
        }
        const fcExit = e.target.closest("[data-flashcard-exit]");
        if (fcExit) {
          state.flashcardMode = false;
          state.flashcardFiltersOpen = false;
          document.body.classList.remove("is-flashcard-mode", "flashcard-filters-open");
          els.toggleFlashcard.setAttribute("aria-pressed", "false");
          els.toggleQuiz.disabled = false;
          renderCards();
          return;
        }
        const revealBtn = e.target.closest("[data-reveal-btn]");
        if (revealBtn) {
          const box = revealBtn.closest("[data-answer-box]");
          if (box) {
            const isNowHidden = box.classList.toggle("hidden-answer");
            revealBtn.textContent = isNowHidden ? "答えを表示" : "答えを隠す";
            revealBtn.setAttribute("aria-expanded", String(!isNowHidden));
          }
        }
      });

      document.addEventListener("keydown", (e) => {
        if (!state.flashcardMode) return;
        if (document.activeElement === els.searchInput) return;
        if (e.key === "ArrowLeft") {
          if (state.flashcardIndex > 0) {
            state.flashcardIndex -= 1;
            state.flashcardRevealed = false;
            renderCards();
          }
        } else if (e.key === "ArrowRight") {
          const total = getFilteredEntries().length;
          if (state.flashcardIndex < total - 1) {
            state.flashcardIndex += 1;
            state.flashcardRevealed = false;
            renderCards();
          }
        } else if (e.key === " " && e.target.tagName !== "BUTTON") {
          e.preventDefault();
          state.flashcardRevealed = !state.flashcardRevealed;
          renderCards();
        }
      });

      els.reloadLatest.addEventListener("click", () => {
        if (window.location.protocol === "http:" || window.location.protocol === "https:") {
          const url = new URL(window.location.href);
          url.searchParams.set("_t", String(Date.now()));
          window.location.replace(url.toString());
        } else {
          window.location.reload();
        }
      });

      const ANKI_DECK_KEY = "english_mistake_log_anki_deck_v1";

      async function ankiInvoke(action, params = {}) {
        const res = await fetch("http://127.0.0.1:8765", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action, version: 6, params })
        });
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }
        const json = await res.json();
        if (json.error) {
          throw new Error(json.error);
        }
        return json.result;
      }

      function buildAnkiFront(entry) {
        const meta = `[${escapeHtml(entry.date || "")}] ${escapeHtml(entry.category || "")}`;
        const prompt = escapeHtml(entry.japanese || entry.explanation || "");
        return `
          <div style="text-align:left; font-family:sans-serif; line-height:1.6;">
            <div style="font-size:12px; color:#64748b; margin-bottom:8px;">${meta}</div>
            <div style="font-size:20px; font-weight:700;">${prompt}</div>
          </div>
        `.trim();
      }

      function buildAnkiBack(entry) {
        const correction = escapeHtml(entry.correction || "");
        const whatISaid = escapeHtml(entry.whatISaid || "");
        const explanation = escapeHtml(entry.explanation || "");
        const examples = (entry.examples || [])
          .map((ex) => `<li style="margin-bottom:4px;">${escapeHtml(ex)}</li>`)
          .join("");
        const examplesBlock = examples
          ? `<div style="margin-top:12px;">
               <div style="font-size:12px; font-weight:700; color:#64748b; margin-bottom:4px;">例文 (Example)</div>
               <ul style="margin:0; padding-left:20px;">${examples}</ul>
             </div>`
          : "";
        return `
          <div style="text-align:left; font-family:sans-serif; line-height:1.6;">
            <div style="background:#f0fdf4; border:1px solid #bbf7d0; border-radius:8px; padding:10px 12px; margin-bottom:10px;">
              <div style="font-size:11px; font-weight:700; color:#15803d; margin-bottom:2px;">自然な表現 (Better / Correct)</div>
              <div style="font-size:18px; font-weight:700; color:#0f172a;">${correction}</div>
            </div>
            <div style="background:#fef2f2; border:1px solid #fecaca; border-radius:8px; padding:8px 12px; margin-bottom:10px;">
              <div style="font-size:11px; font-weight:700; color:#b91c1c; margin-bottom:2px;">自分の表現 (What I said)</div>
              <div style="font-size:15px; color:#0f172a;">${whatISaid}</div>
            </div>
            <div style="background:#f8fafc; border-radius:8px; padding:10px 12px; font-size:14px;">
              <div style="font-size:12px; font-weight:700; color:#64748b; margin-bottom:4px;">解説</div>
              <div>${explanation}</div>
            </div>
            ${examplesBlock}
          </div>
        `.trim();
      }

      async function sendFilteredToAnki() {
        const targets = getFilteredEntries();
        if (targets.length === 0) {
          alert("送信対象の表現がありません。");
          return;
        }

        let defaultDeck = "English Mistake Log";
        try {
          defaultDeck = localStorage.getItem(ANKI_DECK_KEY) || defaultDeck;
        } catch (_) {
          // ignore
        }

        const deckName = prompt(
          `表示中の ${targets.length} 件を Anki に送信します。\n送信先のデッキ名を入力してください（存在しない場合は自動作成されます）:`,
          defaultDeck
        );
        if (!deckName || !deckName.trim()) return;
        const cleanDeck = deckName.trim();
        try {
          localStorage.setItem(ANKI_DECK_KEY, cleanDeck);
        } catch (_) {
          // ignore
        }

        const originalLabel = els.sendAnki.textContent;
        els.sendAnki.disabled = true;
        els.sendAnki.textContent = "送信中...";

        try {
          await ankiInvoke("createDeck", { deck: cleanDeck });

          const models = await ankiInvoke("modelNames");
          const modelName =
            models.find((m) => m === "Basic") ||
            models.find((m) => m === "基本") ||
            models[0];
          if (!modelName) {
            throw new Error("利用可能なノートタイプが見つかりません。");
          }

          const fieldNames = await ankiInvoke("modelFieldNames", { modelName });
          if (!fieldNames || fieldNames.length < 2) {
            throw new Error(`ノートタイプ「${modelName}」に表面・裏面のフィールドがありません。`);
          }
          const frontField = fieldNames[0];
          const backField = fieldNames[1];

          const existingIds = await ankiInvoke("findNotes", {
            query: `deck:"${cleanDeck.replace(/"/g, '\\"')}"`
          });
          const existingTags = new Set();
          if (existingIds.length > 0) {
            const infoList = await ankiInvoke("notesInfo", { notes: existingIds });
            for (const info of infoList) {
              for (const tag of info.tags || []) {
                if (tag.startsWith("id:")) {
                  existingTags.add(tag);
                }
              }
            }
          }

          const notesToAdd = [];
          let skippedCount = 0;
          for (const entry of targets) {
            const idTag = `id:${entry.id}`;
            if (existingTags.has(idTag)) {
              skippedCount += 1;
              continue;
            }
            const cleanCategory = String(entry.category || "General").replace(/\s+/g, "_");
            const tags = [
              "english-log",
              idTag,
              cleanCategory,
              ...(entry.tags || []).map((t) => String(t).replace(/\s+/g, "_"))
            ];
            notesToAdd.push({
              deckName: cleanDeck,
              modelName,
              fields: {
                [frontField]: buildAnkiFront(entry),
                [backField]: buildAnkiBack(entry)
              },
              options: {
                allowDuplicate: true
              },
              tags
            });
          }

          if (notesToAdd.length === 0) {
            alert(`デッキ「${cleanDeck}」にはすでに全 ${skippedCount} 件が登録済みです。`);
            return;
          }

          const results = await ankiInvoke("addNotes", { notes: notesToAdd });
          const addedCount = results.filter((r) => r !== null).length;
          alert(
            `Anki デッキ「${cleanDeck}」への送信が完了しました！\n・新規追加: ${addedCount} 件\n・登録済みスキップ: ${skippedCount} 件`
          );
        } catch (err) {
          alert(
            `AnkiConnect への接続に失敗しました。\n\n以下を確認してください：\n1. PC で Anki が起動していること\n2. AnkiConnect の設定で webCorsOriginList に "${window.location.origin}" または "*" が入っていること\n\nエラー詳細: ${err.message}`
          );
        } finally {
          els.sendAnki.disabled = false;
          els.sendAnki.textContent = originalLabel;
        }
      }

      els.sendAnki.addEventListener("click", sendFilteredToAnki);

      function loadEntries() {
        const script = document.createElement("script");
        const suffix = (window.location.protocol === "http:" || window.location.protocol === "https:")
          ? `?_t=${Date.now()}`
          : "";
        script.src = `data.js${suffix}`;
        script.onload = () => {
          entries = Array.isArray(window.ENGLISH_ENTRIES) ? [...window.ENGLISH_ENTRIES] : [];
          render();
        };
        script.onerror = () => {
          entries = Array.isArray(window.ENGLISH_ENTRIES) ? [...window.ENGLISH_ENTRIES] : [];
          render();
        };
        document.body.appendChild(script);
      }

      loadEntries();
    })();
  </script>
</body>
